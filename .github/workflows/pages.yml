name: Publish public panel
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Publish the verified initial public snapshot
        type: boolean
        default: false
  schedule:
    - cron: '8,38 * * * *'

permissions: {}
concurrency:
  group: public-panel-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest test_public_reader test_share_panel
      - if: ${{ !inputs.bootstrap }}
        run: python3 build.py
      - if: ${{ inputs.bootstrap }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download initial-public --pattern public-panel.zip
          echo 'fe6e0414242cd4915c0639f59b1946e4470107574c215896af34b577b9d45745  public-panel.zip' | sha256sum --check
          unzip -q public-panel.zip -d initial-snapshot
          python3 build.py --snapshot-dir initial-snapshot
      - run: python3 public_rss.py
      - run: python3 build_share.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
  backup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: generator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: reader
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: bundle
      - name: Build from the same public files as Pages
        run: |
          mkdir snapshot
          tar -xf bundle/artifact.tar -C snapshot
          python3 generator/build_backup.py --source snapshot --out export
      - name: Publish the online reader and downloadable panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s export/panel.html && test -s export/README.md && test -d export/sections
          cp export/README.md published/README.md
          rsync -a --delete export/sections/ published/sections/
          git -C published config user.name "AI Panel Publisher"
          git -C published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published add -- README.md sections
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m "Refresh public research reader"
            git -C published push origin HEAD:reader
          fi
          sha=$(sha256sum export/panel.html | cut -d' ' -f1)
          current=$(gh release view public-reader -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="panel.html") | .digest')
          if [ "$current" != "sha256:$sha" ]; then
            cp export/panel.html export/panel-latest.html
            gh release upload public-reader export/panel-latest.html --clobber -R "$GITHUB_REPOSITORY"
            gh release upload public-reader export/panel.html --clobber -R "$GITHUB_REPOSITORY" || gh release upload public-reader export/panel.html --clobber -R "$GITHUB_REPOSITORY"
          fi
