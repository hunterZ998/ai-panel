name: Publish public panel
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Publish the verified initial public snapshot
        type: boolean
        default: false
  schedule:
    - cron: '8,38 * * * *'

permissions: {}
concurrency:
  group: public-panel-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: ${{ !inputs.bootstrap }}
        run: python3 build.py
      - if: ${{ inputs.bootstrap }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download initial-public --pattern public-panel.zip
          echo '8bc278a453c5da2d0b6de757a541e2ccfde816a2eeae3cc70b5c171e902ff71e  public-panel.zip' | sha256sum --check
          unzip -q public-panel.zip -d dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
